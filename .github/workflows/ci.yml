---
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # The real checks (scripts/verify.sh, 42 of them) need two VMs and cannot run on a hosted runner.
    # This job catches the mistakes that do not need a machine: syntax, style, risky patterns and scripts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the linters
        run: pip install ansible ansible-lint yamllint
      - name: YAML style
        run: yamllint --strict .
      - name: Playbook syntax (against the example inventory)
        run: ansible-playbook -i inventory.ini.example setup.yml --syntax-check
      - name: ansible-lint
        run: ansible-lint setup.yml roles
      - name: Shell scripts
        run: shellcheck --severity=warning scripts/*.sh

  molecule:
    # Runs the roles that do not need real machines (ssh, nginx, app, integrity_check) in an Ubuntu 24.04 container with
    # systemd, checks the hardening and the tamper detection, and checks that a second run changes nothing.
    # Not covered here: ufw, fail2ban, WireGuard and the two-machine ProxyJump setup. `make verify` covers those on the VMs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Molecule
        run: pip install ansible-core molecule "molecule-plugins[docker]"
      - name: Molecule test
        run: molecule test
