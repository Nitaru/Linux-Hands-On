---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Remove the default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Install the site configuration
  ansible.builtin.template:
    src: fortress.conf.j2
    dest: /etc/nginx/conf.d/fortress.conf
    mode: "0644"
  notify: Reload nginx

- name: Hide the nginx version
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*#?\s*server_tokens'
    line: "\tserver_tokens off;"
    insertafter: '^\s*sendfile'
  notify: Reload nginx

- name: Validate the nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Start nginx and enable it at boot
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
